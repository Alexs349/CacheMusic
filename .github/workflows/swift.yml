name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install XcodeGen
        run: brew install xcodegen
      
      - name: Generate Xcode project
        run: xcodegen generate
      
      - name: Build archive
        run: |
          xcodebuild archive \
            -project CacheMusic.xcodeproj \
            -scheme CacheMusic \
            -archivePath build/CacheMusic.xcarchive \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" | xcpretty || true
      
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/CacheMusic.xcarchive/Products/Applications/CacheMusic.app Payload/
          zip -r CacheMusic.ipa Payload
          ls -la
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CacheMusic-ipa
          path: CacheMusic.ipa
